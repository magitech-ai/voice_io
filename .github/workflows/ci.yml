name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-only:
    name: Source-only tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Run source-only tests
        run: uv run --locked python -m pytest -q tests/test_source_only.py

      - name: Lint
        run: uv run --locked ruff check voice_io tests

      - name: Build distributions
        run: uv build
