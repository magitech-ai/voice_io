[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-io"
version = "0.3.0"
description = "Offline CPU bidirectional speech-to-text and text-to-speech SDK and CLI for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.0",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.scripts]
voice-io = "voice_io.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["voice_io"]

[tool.hatch.build.targets.wheel.force-include]
"voice_io/respell.tsv" = "voice_io/respell.tsv"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["voice_io"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
